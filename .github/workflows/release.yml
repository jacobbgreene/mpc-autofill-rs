name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: security
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb
          - name: windows-x64
            os: windows-2022
            bundles: nsis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release ancestry
        run: node scripts/check-release-history.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils xvfb dbus-x11 x11-utils python3-xlib
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test
      - run: node --test scripts/tests/*.test.mjs
      - name: Install browser test runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Select installed test browser
        run: node --input-type=module -e "import { chromium } from './frontend/node_modules/playwright-core/index.mjs'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'CHROME=' + chromium.executablePath() + '\n');"
      - run: npm --prefix frontend run test:browser
      - name: Preserve failed browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results-${{ matrix.name }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo test --workspace --locked
      - name: Verify optimized GLib security regression
        if: runner.os == 'Linux'
        run: cargo test --release -p mpc-autofill --test glib_variant_security --locked
      - name: Verify production browser ownership and shutdown
        run: cargo test -p autofill-automation --locked -- --ignored
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Build installers
        shell: bash
        run: tauri build --verbose --bundles ${{ matrix.bundles }} -- --locked
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: |
          package=(target/release/bundle/appimage/*.AppImage)
          chmod +x "${package[0]}"
          "${package[0]}" --appimage-extract > /dev/null
          python3 scripts/smoke-linux.py squashfs-root/AppRun
      - name: Install and smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Save installers
        run: node scripts/collect-installers.mjs
      - name: Package source and license notices
        if: runner.os == 'Linux'
        run: node scripts/collect-source.mjs
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: dist/*

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true
      - name: Create checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: installers
        run: |
          test "$(find . -name '*.exe' | wc -l)" -eq 1
          test "$(find . -name '*.AppImage' | wc -l)" -eq 1
          test "$(find . -name '*.deb' | wc -l)" -eq 1
          test "$(find . -name '*_source.tar.gz' | wc -l)" -eq 1
          test -s LICENSE && test -s NOTICE.md && test -s SOURCE.json
          sha256sum ./*.exe ./*.AppImage ./*.deb ./*_source.tar.gz LICENSE NOTICE.md SOURCE.json > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.exe ./*.AppImage ./*.deb ./*_source.tar.gz LICENSE NOTICE.md SOURCE.json SHA256SUMS --verify-tag --draft --prerelease --title "MPC Autofill $RELEASE_TAG" --generate-notes
