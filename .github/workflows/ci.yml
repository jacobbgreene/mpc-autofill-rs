name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: node scripts/check-release-version.mjs
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test
      - name: Install isolated browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Select installed test browser
        run: node --input-type=module -e "import { chromium } from './frontend/node_modules/playwright-core/index.mjs'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'CHROME=' + chromium.executablePath() + '\n');"
      - run: npm --prefix frontend run test:browser
      - run: npm --prefix frontend run build
      - run: cargo test --workspace --locked
      - name: Verify optimized GLib security regression
        if: runner.os == 'Linux'
        run: cargo test --release -p mpc-autofill --test glib_variant_security --locked
      - name: Verify production browser ownership and shutdown
        # Test-owned profiles and about:blank only; browser sandbox stays enabled.
        run: cargo test -p autofill-automation --locked -- --ignored
      - name: Preserve failed browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results-${{ matrix.os }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
