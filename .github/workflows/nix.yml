name: Nix package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Check npm fixed-output hash
        shell: bash
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("flake.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
          actual=$(nix run "github:NixOS/nixpkgs/$revision#prefetch-npm-deps" -- frontend/package-lock.json)
          expected=$(sed -n 's/.*hash = "\([^"]*\)";.*/\1/p' flake.nix)
          echo "Expected: $expected"
          echo "Computed: $actual"
          test "$actual" = "$expected"
      - name: Build the locked Linux package
        run: nix build --print-build-logs
      - name: Verify installed version
        run: |
          expected=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          test "$(nix eval --raw .#packages.x86_64-linux.default.version)" = "$expected"
