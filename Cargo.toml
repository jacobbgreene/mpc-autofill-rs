[workspace]
resolver = "2"
members = ["crates/core", "crates/automation", "src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
autofill-core = { path = "crates/core" }
autofill-automation = { path = "crates/automation" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
