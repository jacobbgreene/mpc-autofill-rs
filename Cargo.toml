[workspace]
resolver = "2"
members = ["crates/core", "crates/automation", "src-tauri"]
exclude = ["vendor/glib"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
autofill-core = { path = "crates/core" }
autofill-automation = { path = "crates/automation" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# GTK3 requires GLib 0.18. This carries the upstream two-line fix without a GUI
# dependency migration. See vendor/glib/PATCH.md and the integrity CI gate.
[patch.crates-io]
glib = { path = "vendor/glib" }
